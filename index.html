<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dedun</title>
</head>
<body>
<p>Redirecting back to Dedun…</p>
<script>
	// Enable Banking (and most PSD2 aggregators) only accept https://
	// redirect_url values — they won't take a custom app scheme
	// directly. This page is the bridge: it's the https:// URL
	// registered with the provider, and its only job is to hand the
	// query string straight back to the app via its own URL scheme,
	// which the OS (or expo-web-browser's openAuthSessionAsync) picks
	// up from inside a mobile browser. No data is stored or logged here.
	//
	// TEMPORARY, session-specific: while testing via Expo Go (not a
	// standalone build), the app's deep link is exp://<host>/--/…, not
	// the dedun:// custom scheme — Expo Go can't register that until
	// there's a standalone/dev-client build. Running `expo start
	// --tunnel` (needed since plain LAN mode hit connectivity issues —
	// see CLAUDE.md), so <host> is the tunnel host, not a LAN IP.
	// That host is derived from the `urlRandomness` value persisted in
	// finance-app/.expo/settings.json, so it stays stable across restarts
	// on this machine — but it WILL change on a fresh checkout, a
	// different dev machine, or if that file is ever deleted. If the
	// redirect starts failing with "failed to fetch remote update"
	// again, that file's value (and this URL) are the first thing to
	// check — switch back to 'dedun://auth/callback' once building
	// standalone, which sidesteps this permanently.
	window.location.replace('exp://luntjii-anonymous-8081.exp.direct/--/auth/callback' + window.location.search);
</script>
</body>
</html>
