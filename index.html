<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dedun</title>
</head>
<body>
<p>Redirecting back to Dedun…</p>
<script>
	// Enable Banking (and most PSD2 aggregators) only accept https://
	// redirect_url values — they won't take a custom app scheme
	// directly. This page is the bridge: it's the https:// URL
	// registered with the provider, and its only job is to hand the
	// query string straight back to the app via its own URL scheme,
	// which the OS (or expo-web-browser's openAuthSessionAsync) picks
	// up from inside a mobile browser. No data is stored or logged here.
	//
	// TEMPORARY: while testing via Expo Go (not a standalone build), the
	// app's deep link is exp://<host>/--/…, not the dedun:// custom
	// scheme — Expo Go can't register that until there's a standalone/
	// dev-client build. <host> is one-choice-raptor.ngrok-free.app, a
	// reserved ngrok domain manually tunneled to Metro on :8081 (this
	// is the SAME reserved domain used for the Enable Banking signing
	// server on :3001 — an ngrok Traffic Policy on that tunnel routes
	// /sign-jwt to the signing server and everything else to Metro; see
	// dedun-signing-server/traffic-policy.yml and CLAUDE.md "Enable
	// Banking"). Because it's a reserved domain rather than Expo's own
	// ephemeral --tunnel host, this URL shouldn't need updating again —
	// switch to 'dedun://auth/callback' once building standalone, which
	// sidesteps needing any of this.
	window.location.replace('exp://one-choice-raptor.ngrok-free.app/--/auth/callback' + window.location.search);
</script>
</body>
</html>
